# A JSON API endpoint (webhooks, an MCP server, JSON-RPC) on a server where
# ModSecurity is enabled (CyberPanel can install it with the OWASP rule set).
# Generic rules routinely flag JSON bodies that contain URLs, code or HTML.
# Turn ModSecurity off for this context only, and make the app do its own auth.

context /api-endpoint/ {
  type                    proxy
  handler                 my_app
  addDefaultCharset       off

  extraHeaders            <<<END_extraHeaders
modsecurity off
END_extraHeaders
}
