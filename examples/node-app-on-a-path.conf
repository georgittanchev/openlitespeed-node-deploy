# Serve a Node app (Next.js, Express, anything listening on HTTP) under a path
# of an existing OpenLiteSpeed / CyberPanel site, e.g. https://example.com/app/
#
# Paste into the vhost config (CyberPanel: /usr/local/lsws/conf/vhosts/<domain>/vhost.conf),
# then: /usr/local/lsws/bin/lswsctrl reload
#
# The app itself must know its prefix (Next.js: basePath: '/app').

extprocessor my_app {
  type                    proxy
  address                 127.0.0.1:6010      # bind the app to loopback only
  maxConns                50
  pcKeepAliveTimeout      60
  initTimeout             60                  # seconds OLS waits for the first byte; raise it
                                              # above your slowest request (see README)
  retryTimeout            0
  respBuffer              0                   # don't buffer: streamed responses go out as they come
}

context /app {
  type                    proxy
  handler                 my_app
  addDefaultCharset       off                 # otherwise OLS appends a charset to every
                                              # Content-Type, including images and JSON
}
