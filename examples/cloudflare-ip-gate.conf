# Restrict a path to your own IP addresses on a site behind Cloudflare.
#
# Behind Cloudflare every request comes from a Cloudflare IP, so a plain IP
# allowlist can't see the visitor. The visitor is in CF-Connecting-IP, but
# anyone who finds the origin's IP can send that header themselves.
# Two layers close the gap:
#   1. accessControl admits only Cloudflare's edges (+ loopback), so the
#      header can't be forged by calling the origin directly;
#   2. the rewrite rule returns 403 unless CF-Connecting-IP is yours.
#
# Generate the allow line with: scripts/cloudflare-allowlist.sh 127.0.0.1 ::1 203.0.113.7
# 203.0.113.7 and 2001:db8:1234:5678::/64 below are placeholders for your own addresses.

context /private/ {
  location                /var/www/private/
  allowBrowse             1
  autoIndex               0
  indexFiles              index.html
  addDefaultCharset       off

  rewrite  {
    enable                  1
    autoLoadHtaccess        0
    rules                   <<<END_rules
RewriteCond %{HTTP:CF-Connecting-IP} !^(203\.0\.113\.7|2001:db8:1234:5678:[0-9a-f:]+)$ [NC]
RewriteRule .* - [F]
END_rules
  }

  accessControl  {
    allow                 203.0.113.7, 2001:db8:1234:5678::/64, 127.0.0.1, ::1, 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22, 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32
    deny                  *
  }

  extraHeaders            <<<END_extraHeaders
Header always set Cache-Control "private, no-store"
END_extraHeaders
}

# Proxied apps work the same way: put the accessControl block in the proxy
# context and check CF-Connecting-IP in the app (or with the same rewrite).
